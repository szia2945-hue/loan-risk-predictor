<svg width="1100" height="240" viewBox="0 0 1100 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="1100" height="240" fill="#0A1930"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#C9A15A"/>
    </marker>
  </defs>

  <!-- nodes -->
  <g font-family="Courier New, monospace" font-size="13" fill="#E9E4D8">
    <!-- 1 -->
    <rect x="30" y="90" width="170" height="64" rx="3" fill="#0F2340" stroke="#24405F"/>
    <text x="115" y="115" text-anchor="middle" fill="#C9A15A" font-size="11" letter-spacing="1">01</text>
    <text x="115" y="135" text-anchor="middle">generate_data.py</text>
    <text x="115" y="150" text-anchor="middle" font-size="10" fill="#9FB0C4">synthetic loan data</text>

    <line x1="200" y1="122" x2="248" y2="122" stroke="#C9A15A" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- 2 -->
    <rect x="250" y="90" width="150" height="64" rx="3" fill="#0F2340" stroke="#24405F"/>
    <text x="325" y="115" text-anchor="middle" fill="#C9A15A" font-size="11" letter-spacing="1">02</text>
    <text x="325" y="135" text-anchor="middle">loan_data.csv</text>
    <text x="325" y="150" text-anchor="middle" font-size="10" fill="#9FB0C4">2,000 records</text>

    <line x1="400" y1="122" x2="448" y2="122" stroke="#C9A15A" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- 3 -->
    <rect x="450" y="90" width="150" height="64" rx="3" fill="#0F2340" stroke="#24405F"/>
    <text x="525" y="115" text-anchor="middle" fill="#C9A15A" font-size="11" letter-spacing="1">03</text>
    <text x="525" y="135" text-anchor="middle">train.py</text>
    <text x="525" y="150" text-anchor="middle" font-size="10" fill="#9FB0C4">RF + StandardScaler</text>

    <line x1="600" y1="122" x2="648" y2="122" stroke="#C9A15A" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- 4 -->
    <rect x="650" y="90" width="170" height="64" rx="3" fill="#0F2340" stroke="#24405F"/>
    <text x="735" y="115" text-anchor="middle" fill="#C9A15A" font-size="11" letter-spacing="1">04</text>
    <text x="735" y="135" text-anchor="middle">model.pkl / scaler.pkl</text>
    <text x="735" y="150" text-anchor="middle" font-size="10" fill="#9FB0C4">serialized artifacts</text>

    <line x1="820" y1="122" x2="868" y2="122" stroke="#C9A15A" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- 5 -->
    <rect x="870" y="70" width="200" height="104" rx="3" fill="#0F2340" stroke="#C9A15A" stroke-width="1.5"/>
    <text x="970" y="95" text-anchor="middle" fill="#C9A15A" font-size="11" letter-spacing="1">05</text>
    <text x="970" y="118" text-anchor="middle">app.py (Flask)</text>
    <text x="970" y="136" text-anchor="middle" font-size="10" fill="#9FB0C4">/predict &#183; /health</text>
    <text x="970" y="152" text-anchor="middle" font-size="10" fill="#9FB0C4">templates/index.html</text>
  </g>
</svg>
